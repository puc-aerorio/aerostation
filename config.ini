[serial]
port = COM4
baudrate = 115200
serial_available = false

[post]
path_receive_info = update-info/

[list-updater]
seconds_to_device_be_inactive = 50
seconds_to_device_be_on_hold = 25
update_delay = 20

; Maps a command number to "<endpoint>,<method>[,<param>...]".
; Everything after the method names a query parameter the command accepts;
; the consumer drops any parameter not listed here, so the front-end cannot
; append arbitrary query strings.
; Trailing slashes are load-bearing: uav_api's execute-script and stop-script
; 307-redirect without them, and aiohttp drops the POST body on redirect.
[commands-list]
20 = telemetry/gps,get
22 = telemetry/ned,get
24 = command/arm,get
26 = command/takeoff,get,alt
28 = command/land,get
30 = command/rtl,get
33 = command/brake,get
35 = command/guided,get
; Non-blocking: returns as soon as the target is accepted. The _wait variant
; would hold the request open for up to 60s, which is wrong for a UI.
60 = movement/go_to_gps/,post
42 = mission/list-scripts,get
44 = mission/upload-script,post
46 = mission/execute-script/,post
48 = mission/clear-scripts,delete
50 = mission/running-scripts,get
52 = mission/stop-script/,post
54 = mission/script-log,get,script_name,stream,tail

; Bounds for the "poll_start" button type. min_interval is a hard floor applied
; server-side, so a front-end bug cannot recreate the old unthrottled loop.
[polling]
min_interval = 1.0
max_interval = 60.0
default_interval = 2.0

; Timeouts (seconds) for outbound HTTP to the drone. /command/rtl and
; /command/land block until the vehicle has landed and disarmed, hence generous.
[http]
request_timeout = 300
connect_timeout = 5

; Address used only when a device registers without reporting its own.
; uav_api always sends one, so this is a safety net rather than configuration.
[fallback]
default_uav_address = http://127.0.0.1:8000/
